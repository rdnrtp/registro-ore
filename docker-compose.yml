name: registro-ore

x-db-env: &db-env
  PGHOST: db
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:?manca POSTGRES_USER nel file .env}
  PGPASSWORD: ${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD nel file .env}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?manca POSTGRES_DB nel file .env}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      target: prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      PGDATABASE: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?manca JWT_SECRET nel file .env}
      JWT_DURATA_ORE: ${JWT_DURATA_ORE:-168}
      INVITO_DURATA_ORE: ${INVITO_DURATA_ORE:-72}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOGIN_FINESTRA_MINUTI: ${LOGIN_FINESTRA_MINUTI:-15}
      LOGIN_MAX_FALLITI_PER_EMAIL: ${LOGIN_MAX_FALLITI_PER_EMAIL:-5}
      LOGIN_MAX_FALLITI_PER_IP: ${LOGIN_MAX_FALLITI_PER_IP:-30}
      # Indirizzo dell'app per i link nelle email (inviti, avvisi, promemoria).
      APP_URL: ${APP_URL:-http://localhost:8088}
      # Posta in uscita. Senza altre indicazioni va alla casella finta
      # "mailpit" qui sotto: nessuna email esce davvero.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      POSTA_MITTENTE: ${POSTA_MITTENTE:-registro-ore@localhost}
      POSTA_MAX_TENTATIVI: ${POSTA_MAX_TENTATIVI:-8}
    volumes:
      # Dati privati dell'impianto (fuori da git), letti dai comandi di caricamento.
      - ./modello:/dati/modello:ro
      - ./seed:/dati/seed:ro

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8088}:80"

  # Casella di posta finta per lo sviluppo: riceve tutte le email dell'API e
  # le mostra in una pagina web (http://localhost:8025). Non inoltra nulla.
  # Raggiungibile solo da questo computer (127.0.0.1): le email contengono
  # link di invito personali. Il servizio di posta vero si sceglie nella Fase 6.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # Test automatici, su un database separato (registro_ore_test) nello stesso
  # PostgreSQL. Si avvia solo esplicitamente: docker compose run --rm api-test
  api-test:
    profiles: ["test"]
    build:
      context: ./api
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      PGDATABASE: registro_ore_test
      # I test dell'esportazione usano il modello reale di BV e la sua mappa.
      MODELLO_BV: /dati/modello/modello_bv.xlsx
      SEED_DIR: /dati/seed
    volumes:
      - ./modello:/dati/modello:ro
      - ./seed:/dati/seed:ro

volumes:
  pgdata:
