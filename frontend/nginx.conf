server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Non dichiarare la versione di nginx nelle risposte e nelle pagine di errore.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 21 MB: le foto delle ricevute (l'API accetta fino a 20 MB, poi le
        # riduce) e il modello Excel caricato dall'amministratore (fino a 5 MB).
        client_max_body_size 21m;
    }

    # Niente add_header nelle location: annullerebbe quelli del server.
    # I file in /assets hanno l'hash nel nome: si possono tenere in cache.
    location /assets/ {
        expires 1y;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }

    # App installabile: il manifest con il suo tipo (nginx non lo conosce).
    # Come index.html e sw.js, mai in cache: un nome nuovo arriva subito.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }
}
