server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 6 MB: il modello Excel caricato dall'amministratore (l'API accetta fino a 5 MB).
        client_max_body_size 6m;
    }

    # Niente add_header nelle location: annullerebbe quelli del server.
    # I file in /assets hanno l'hash nel nome: si possono tenere in cache.
    location /assets/ {
        expires 1y;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
